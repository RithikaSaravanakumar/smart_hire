<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SmartHire Enterprise Portal</title>
  <meta name="description" content="Secure authentication for students, campus recruiters, and administrators." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar" aria-label="Main Navigation">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo" aria-label="SmartHire Home">
        <div class="logo-icon" aria-hidden="true">⚡</div>
        <div>Smart<span class="highlight">Hire</span></div>
      </a>
      <ul class="nav-links" id="nav-links-container"></ul>
    </div>
  </nav>

  <main class="page-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 140px);">
    <div class="container" style="max-width: 460px;">
      <div class="card" style="padding: 2.5rem 2.25rem; box-shadow: var(--shadow-lg);">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="hero-badge" style="margin-bottom: 1rem;">🔐 Enterprise Authentication</div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.4rem;">Sign in to SmartHire</h1>
          <p style="color: var(--text-secondary); font-size: 0.925rem;">
            Enter your credentials to access your personalized workspace.
          </p>
        </div>

        <form id="login-form" novalidate>
          <!-- Email Input -->
          <div class="form-group">
            <label class="form-label" for="login-email">Work or Academic Email <span class="required">*</span></label>
            <input 
              type="email" 
              id="login-email" 
              class="form-control" 
              placeholder="e.g. arjun.sharma@example.com" 
              autocomplete="email" 
              required 
              autofocus 
            />
          </div>

          <!-- Password Input with Toggle -->
          <div class="form-group">
            <label class="form-label" for="login-password">Password <span class="required">*</span></label>
            <div class="password-input-wrapper">
              <input 
                type="password" 
                id="login-password" 
                class="form-control" 
                placeholder="Enter account password" 
                autocomplete="current-password" 
                required 
              />
              <button 
                type="button" 
                class="password-toggle-btn" 
                onclick="togglePasswordVisibility('login-password', this)"
                aria-label="Show password"
              >👁️</button>
            </div>
          </div>

          <!-- Submit Action -->
          <div style="margin-top: 1.75rem;">
            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
              <span id="login-btn-text">Sign In &rarr;</span>
            </button>
          </div>

          <!-- Quick Demo Role Switcher -->
          <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-subtle);">
            <div style="font-size: 0.775rem; color: var(--text-muted); margin-bottom: 0.85rem; text-align: center; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">
              Quick Demo Fill:
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('student')">🎓 Student</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('recruiter')">🏢 Recruiter</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('admin')">👑 Admin</button>
            </div>
          </div>

          <!-- Registration Link -->
          <div style="text-align: center; margin-top: 1.75rem; color: var(--text-secondary); font-size: 0.9rem;">
            New student applicant? <a href="/register.html" style="font-weight: 600;">Create an account &rarr;</a>
          </div>

        </form>

      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
