<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SmartHire Placement Portal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/index.html" class="brand-logo">
        <div class="logo-icon">⚡</div>
        <div>Smart<span class="highlight">Hire</span></div>
      </a>
      <ul class="nav-links" id="nav-links-container"></ul>
    </div>
  </nav>

  <main style="padding: 3.5rem 0 5rem; flex: 1; display: flex; align-items: center;">
    <div class="container" style="max-width: 480px;">
      <div class="card" style="padding: 2.5rem 2rem;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="hero-badge">🔐 Secure Authentication</div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.4rem;">Sign in to SmartHire</h1>
          <p style="color: var(--text-muted); font-size: 0.92rem;">
            Access your personalized dashboard, applications, or recruiter tools.
          </p>
        </div>

        <form id="login-form">
          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autofocus />
          </div>

          <!-- Password -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
              <button type="button" id="toggle-password-btn" style="background: none; border: none; color: var(--accent-cyan); font-size: 0.8rem; cursor: pointer;">Show Password</button>
            </div>
            <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required />
          </div>

          <!-- Submit Button -->
          <div style="margin-top: 1.75rem;">
            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg">
              <span id="login-btn-text">Sign In</span>
              <span id="login-btn-spinner" class="spinner" style="display: none; width: 18px; height: 18px;"></span>
            </button>
          </div>

          <!-- Demo Quick Fill Buttons -->
          <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-subtle);">
            <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center; font-weight: 600;">
              QUICK TEST LOGINS:
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('student')">🎓 Student</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('recruiter')">🏢 Recruiter</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('admin')">👑 Admin</button>
            </div>
          </div>

          <div style="text-align: center; margin-top: 1.75rem; color: var(--text-muted); font-size: 0.92rem;">
            New student? <a href="/register.html" style="font-weight: 600;">Register here &rarr;</a>
          </div>

        </form>

      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
